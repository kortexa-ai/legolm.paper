[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "legolm-paper1"
version = "2.0.0"
description = "Reproduction of conditional LoRA bridges: capacity and conditioning"
requires-python = ">=3.11"
dependencies = ["torch==2.13.0", "torchvision==0.28.0", "transformers==5.15.1", "numpy==2.4.6", "pyarrow>=15", "tiktoken>=0.7", "pillow>=10", "opencv-python-headless>=4.10", "safetensors>=0.5", "matplotlib>=3.9"]

[project.scripts]
paper1 = "legolm_p01.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legolm_p01"]

[tool.hatch.build.targets.wheel.force-include]
assets = "legolm_p01/assets"
"manuscript/template.tex" = "legolm_p01/manuscript/template.tex"
"manuscript/references.bib" = "legolm_p01/manuscript/references.bib"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "assets", "configs", "manifests", "artifacts", "manuscript", "verify_artifacts.py", "README.md", "REVISION_NOTES.md", "METHOD_CONTRACT.md", "extraction.json", "uv.lock"]

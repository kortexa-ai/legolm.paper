[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "conditional-lora-bridges-paper"
version = "0.1.0"
description = "Paper runner and reproducibility harness for Conditional LoRA Bridges"
readme = "src/README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pillow>=10",
  "pyarrow>=15",
  "requests>=2.32",
  "rustbpe>=0.1.0",
  "tiktoken>=0.7",
  "torch>=2.5",
  "torchvision>=0.20",
]

[project.scripts]
paper-run = "src.cli:main"
paper-reproduce = "src.reproduce:main"
paper-figures = "src.figures:main"
paper-render-arxiv = "src.render_arxiv:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
  "src/**/*.py",
  "src/**/*.md",
  "arxiv/**/*.tex",
  "arxiv/**/*.bib",
  "run_all.sh",
  "setup.sh",
  "README.md",
  "LICENSE",
  "figures/**/*.png",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "legolm-jspace-spectrum-repro"
version = "0.1.0"
description = "Standalone reproduction for token-level affect spectra in Qwen 3.6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate==1.14.0",
  "jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e",
  "matplotlib==3.10.8",
  "numpy==2.4.2",
  "torch==2.12.0",
  "transformers==5.12.1",
]

[project.scripts]
jspace-spectrum-paper = "jspace_spectrum.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/jspace_spectrum"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
